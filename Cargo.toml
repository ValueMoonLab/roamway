[package]
name = "roamway"
version = "1.4.0"
edition = "2021"
description = "Mini multi-agent orchestrator for domestic LLM CLIs, designed for long-running unattended operation"

[[bin]]
name = "roamway"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# OS CSPRNG for token/salt/ID entropy. Already in the dependency tree via
# ureq -> rustls -> ring, so promoting it adds no new download (offline-safe).
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
# strip 必须留空：rustc 1.99 在 strip=symbols + LTO 的干净构建下会在 back/lto.rs
# prepare_lto 处 ICE（couldn't open rlib）。二进制在部署脚本里另用 strip 处理。